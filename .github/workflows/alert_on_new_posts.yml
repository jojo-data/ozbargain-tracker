name: OzBargain Scraper Alert

on:
  schedule:
    # Runs at 37 minutes past every 6 hours.
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'OzBargain RSS feed URL to poll (category/tag feed)'
        required: false
        type: string
        default: 'https://www.ozbargain.com.au/cat/computing/feed'
      title_filter:
        description: 'Space/comma-separated terms; all must appear in the deal title (case-insensitive). Empty = no filter.'
        required: false
        type: string
        default: 'gaming pc'
      last_posts_file:
        description: 'Last posts file to track posts'
        required: false
        type: string
        default: 'data/posts/gaming_pc.csv'
      sender_email:
        description: 'Sender email address to send alerts'
        required: false
        type: string
        default: 'ozbargain-alerts@notifications.legalcents.com.au'
      recipient_email:
        description: 'Email recipient address to receive alerts'
        required: false
        type: string
        default: 'joe@legalcents.com.au'
      title:
        description: 'Title of the alert to send in the email'
        required: false
        type: string
        default: 'Gaming PC Deals'

permissions:
  contents: write

jobs:
  alert-on-new-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          URL: ${{ inputs.url || 'https://www.ozbargain.com.au/cat/computing/feed' }}
          TITLE_FILTER: ${{ inputs.title_filter || 'gaming pc' }}
          LAST_POSTS_FILE: ${{ inputs.last_posts_file || 'data/posts/gaming_pc.csv' }}
          SENDER_EMAIL: ${{ inputs.sender_email || 'ozbargain-alerts@notifications.legalcents.com.au' }}
          RECIPIENT_EMAIL: ${{ inputs.recipient_email || 'joe@legalcents.com.au' }}
          TITLE: ${{ inputs.title || 'Gaming PC Deals' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python alert_on_new_posts.py

      - name: Update weekly keepalive marker
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            date -u '+%G-W%V' > .github/ozbargain-scraper-keepalive.txt
          fi

      - name: Commit scraper state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update OzBargain scraper state"
          files: |
            ${{ inputs.last_posts_file || 'data/posts/gaming_pc.csv' }}
            .github/ozbargain-scraper-keepalive.txt
